name: chan_sccp2 ABI matrix

on:
  push:
    branches:
      - master
    paths:
      - "asterisk-module/**"
      - "sccp-protocol/**"
      - "tools/chan-sccp2-config-checker/**"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".gitmodules"
      - ".github/workflows/asterisk-module.yml"
      - ".github/workflows/asterisk-distro-compatibility.yml"
      - "!**/*.md"
      - "!**/LICENSE*"
  pull_request:
    paths:
      - "asterisk-module/**"
      - "sccp-protocol/**"
      - "tools/chan-sccp2-config-checker/**"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".gitmodules"
      - ".github/workflows/asterisk-module.yml"
      - ".github/workflows/asterisk-distro-compatibility.yml"
      - "!**/*.md"
      - "!**/LICENSE*"

jobs:
  realtime:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Test SQLite, PostgreSQL, and MySQL realtime migrations
        run: ./asterisk-module/realtime/test-backends.sh

      - uses: docker/setup-buildx-action@v3

      - name: Exercise live realtime provider refreshes
        uses: docker/build-push-action@v6
        with:
          context: .
          file: asterisk-module/realtime/Dockerfile
          cache-from: type=gha,scope=asterisk-ci-22.7.0
          cache-to: type=gha,mode=max,scope=asterisk-ci-22.7.0
          pull: true
          push: false

  config-checker:
    runs-on: ubuntu-26.04
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Test configuration checker
        run: cargo test --locked -p chan-sccp2-config-checker

      - name: Validate distributed configuration
        run: >-
          cargo run --locked -p chan-sccp2-config-checker --
          asterisk-module/sccp.conf.example

  build:
    runs-on: ubuntu-26.04
    env:
      RUSTFLAGS: -Dwarnings
    strategy:
      fail-fast: false
      matrix:
        include:
          - asterisk: 22.7.0
            abi: 22plus
            feature: asterisk-22
            publish: true
          - asterisk: 23.4.1
            abi: "23"
            feature: asterisk-23
            publish: false

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Asterisk header prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential libedit-dev libjansson-dev libsqlite3-dev
          libssl-dev libxml2-dev uuid-dev

      - name: Select and configure Asterisk
        working-directory: asterisk-module/asterisk
        run: |
          git fetch --tags origin "refs/tags/${{ matrix.asterisk }}:refs/tags/${{ matrix.asterisk }}"
          git checkout --detach "${{ matrix.asterisk }}"
          ./configure --without-pjproject-bundled --without-jansson-bundled
          make include/asterisk/buildopts.h

      - name: Test Rust state and configuration
        run: cargo test --locked -p asterisk-module --lib

      - name: Build exact Asterisk module
        env:
          ASTERISK_SOURCE_DIR: ${{ github.workspace }}/asterisk-module/asterisk
          ASTERISK_BUILD_DIR: ${{ github.workspace }}/asterisk-module/asterisk
          ASTERISK_VERSION: ${{ matrix.asterisk }}
        run: >-
          cargo build --locked --release -p asterisk-module --no-default-features
          --features ${{ matrix.feature }}

      - name: Verify and package ELF module
        run: |
          readelf -h target/release/libchan_sccp2.so > /tmp/chan-sccp2-elf-header
          grep -q 'Machine:.*Advanced Micro Devices X86-64' /tmp/chan-sccp2-elf-header
          readelf -d target/release/libchan_sccp2.so > /tmp/chan-sccp2-elf-dynamic
          grep -q 'SONAME.*chan_sccp2.so' /tmp/chan-sccp2-elf-dynamic
          nm -D --defined-only target/release/libchan_sccp2.so > /tmp/chan-sccp2-exported-symbols
          grep -q ' T __internal_chan_sccp2_self$' /tmp/chan-sccp2-exported-symbols
          if grep -Eq ' [TDB] (rust_sccp_|sccp_ast_)' /tmp/chan-sccp2-exported-symbols; then
            printf 'legacy adapter symbols escaped the private Rust boundary\n' >&2
            exit 1
          fi
          cp target/release/libchan_sccp2.so "chan_sccp2-asterisk-${{ matrix.abi }}-linux-x86_64.so"

      - uses: actions/upload-artifact@v4
        if: matrix.publish
        with:
          name: chan_sccp2-asterisk-${{ matrix.abi }}-linux-x86_64
          path: chan_sccp2-asterisk-${{ matrix.abi }}-linux-x86_64.so
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - asterisk: 22.7.0
            abi: 22plus
            feature: asterisk-22

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build and verify ARM64 ELF module
        run: |
          docker buildx build \
            --pull \
            --platform linux/arm64 \
            --progress plain \
            --build-arg "ASTERISK_VERSION=${{ matrix.asterisk }}" \
            --build-arg "ASTERISK_FEATURE=${{ matrix.feature }}" \
            --build-arg "ASTERISK_ARTIFACT_LANE=${{ matrix.abi }}" \
            --cache-from "type=gha,scope=asterisk-arm64-${{ matrix.abi }}" \
            --cache-to "type=gha,mode=max,scope=asterisk-arm64-${{ matrix.abi }}" \
            --output type=local,dest=dist \
            --file asterisk-module/Dockerfile.linux \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: chan_sccp2-asterisk-${{ matrix.abi }}-linux-aarch64
          path: dist/chan_sccp2-asterisk-${{ matrix.abi }}-linux-aarch64.so
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - realtime
      - config-checker
      - build
      - build-arm64
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chan_sccp2-asterisk-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.so > SHA256SUMS

      - name: Publish modules for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="build-${GITHUB_SHA}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Release %s already exists; nothing to publish\n' "$release_tag"
            exit 0
          fi
          gh release create "$release_tag" \
            dist/chan_sccp2-asterisk-22plus-linux-x86_64.so \
            dist/chan_sccp2-asterisk-22plus-linux-aarch64.so \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "chan_sccp2 modules ${GITHUB_SHA}" \
            --notes "Automated Linux x86_64 and ARM64/aarch64 modules for the Asterisk 22+ ABI generation. Built against Asterisk 22.7.0 and compatibility-tested with Asterisk 22 and 23." \
            --latest
